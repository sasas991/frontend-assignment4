
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form-html5 validation</title>
    <link rel="stylesheet" href="css/task1.css">
</head>
<body>
    <h1>contact us</h1>

    <form>
        <div>
            <label for="name">name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                minlength="2"
                maxlength="50"
            >
        </div>

        <div>
            <label for="email">email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="message">message:</label>
            <textarea
                id="message"
                name="message"
                required
                minlength="10"
                maxlength="500"
            ></textarea>
        </div>

        <button type="submit">submit</button>
    </form>
</body>
</html>
